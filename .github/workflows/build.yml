name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 项目目标框架为 net10.0-windows；预览/正式 SDK 均可用时优先正式
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} -r win-x64 --no-restore

      - name: Verify no warnings treated as errors
        shell: pwsh
        run: |
          $output = dotnet build -c ${{ matrix.configuration }} -r win-x64 --no-restore 2>&1 | Out-String
          Write-Host $output
          if ($output -match '警告|warning') {
            Write-Host "::warning::Build produced warnings; please review them."
          }

  publish:
    name: Publish single-file exe
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Publish
        run: >
          dotnet publish -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true --no-restore
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeeper-win-x64
          path: publish/SoundKeeper.exe
          if-no-files-found: error
