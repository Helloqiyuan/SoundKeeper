name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      # TreatWarningsAsErrors：把警告当成错误，防止代码质量退化
      - name: Build
        run: >
          dotnet build -c ${{ matrix.configuration }} -r win-x64 --no-restore
          -p:TreatWarningsAsErrors=true

  publish:
    name: Publish single-file exe
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Publish
        run: >
          dotnet publish -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true --no-restore
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeeper-win-x64
          path: publish/SoundKeeper.exe
          if-no-files-found: error
