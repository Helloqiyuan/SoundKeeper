name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      # TreatWarningsAsErrors：把警告当成错误，防止代码质量退化
      - name: Build
        run: >
          dotnet build -c ${{ matrix.configuration }} -r win-x64 --no-restore
          -p:TreatWarningsAsErrors=true

  publish:
    name: Publish release artifacts
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      # 自包含 + 压缩：约 47MB，零依赖，开箱即用
      # 压缩属性在 csproj 中按 SelfContained 条件启用
      - name: Publish (self-contained, compressed)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true --no-restore
          -o publish/full

      # 框架依赖：约 0.7MB，需用户已安装 .NET 10 桌面运行时
      - name: Publish (framework-dependent lite)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true --no-restore
          -o publish/lite

      - name: Rename lite artifact
        shell: pwsh
        run: Rename-Item -Path publish/lite/SoundKeeper.exe -NewName SoundKeeper-lite.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeeper-win-x64
          path: |
            publish/full/SoundKeeper.exe
            publish/lite/SoundKeeper-lite.exe
          if-no-files-found: error
